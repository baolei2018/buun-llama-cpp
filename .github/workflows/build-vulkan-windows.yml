name: CI (vulkan-windows)

on:
  workflow_dispatch:

jobs:
  windows-vulkan:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sys: CLANG64, env: clang-x86_64 }

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          ref: experiment/SD-073-dflash-swa

      - name: Setup ${{ matrix.sys }}
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: ${{ matrix.sys }}
          install: |
            base-devel
            git
            mingw-w64-${{ matrix.env }}-toolchain
            mingw-w64-${{ matrix.env }}-cmake
            mingw-w64-${{ matrix.env }}-vulkan-headers
            mingw-w64-${{ matrix.env }}-glslang
            mingw-w64-${{ matrix.env }}-vulkan-loader

      - name: Configure CMake
        shell: msys2 {0}
        run: |
            cmake -B build \
              -DGGML_VULKAN=ON \
              -DGGML_NATIVE=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        shell: msys2 {0}
        run: |
            cmake --build build --config Release -j$(nproc) 2>&1 | tee build.log
            echo "EXIT_CODE=$?" >> $GITHUB_ENV

      - name: Show build log on failure
        if: failure()
        run: |
            cat build.log

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: llama-windows-vulkan-${{ matrix.sys }}
          path: build/bin/Release/*.exe
          retention-days: 1

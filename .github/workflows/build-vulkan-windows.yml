name: CI (vulkan-windows)

on:
  workflow_dispatch:

jobs:
  windows-vulkan:
    runs-on: windows-2025
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          ref: experiment/SD-073-dflash-swa

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@cafece8e6baf9247cf9b1bf95097b0b983cc558d
        with:
          update: true
          msystem: UCRT64
          install: |
            base-devel
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-glslang

      - name: Build with Vulkan
        shell: msys2 {0}
        run: |
            cmake -B build -DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DCMAKE_BUILD_TYPE=Release -DGGML_FORMAT_CHECK=OFF -DLLAMA_FORMAT_CHECK=OFF
            cmake --build build --config Release -j$(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-windows-vulkan
          path: build/
          retention-days: 1
